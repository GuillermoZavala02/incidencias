spring.application.name=incidencias
spring.datasource.url=jdbc:postgresql://localhost:5432/incidencias_db

spring.datasource.driver-class-name=org.postgresql.Driver
# 1. Indicar a Hibernate que no toque las tablas (Flyway es el dueño del DDL)
spring.jpa.hibernate.ddl-auto=validate
# 2. Configurar el esquema para Flyway
spring.flyway.schemas=pruebas
spring.flyway.default-schema=pruebas

spring.threads.virtual.enabled=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.default_schema=pruebas

logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.com.tuapp=debug